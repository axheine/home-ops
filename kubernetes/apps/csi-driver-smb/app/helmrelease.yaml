apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-smb
  namespace: csi-smb
spec:
  interval: 30m
  releaseName: csi-driver-smb

  chart:
    spec:
      chart: csi-driver-smb
      sourceRef:
        kind: OCIRepository
        name: csi-driver-smb
        namespace: flux-system

  install:
    createNamespace: true

  upgrade:
    remediation:
      retries: 3

  values:
    linux:
      enabled: true

    windows:
      enabled: false

    controller:
      replicas: 2

    node:
      tolerateAllTaints: true

    feature:
      enableInlineVolume: true

    kubelet:
      # OBLIGATOIRE avec Talos
      rootDir: /var/lib/kubelet

    logLevel: 2
