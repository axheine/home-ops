apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: overseerr
spec:
  interval: 10m
  chart:
    spec:
      chart: app-template
      version: 3.x.x
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  values:
    controllers:
      main:
        containers:
          app:
            image:
              repository: sctx/overseerr
              tag: latest
            env:
              TZ: Europe/Paris
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true

    service:
      main:
        ports:
          http:
            port: 5055

    persistence:
      config:
        existingClaim: overseerr-config
    ingress:
        main:
          enabled: true
          className: nginx
          hosts:
            - host: overseerr.home.lab
              paths:
                - path: /
                  pathType: Prefix
          annotations:
            nginx.ingress.kubernetes.io/proxy-body-size: "0"
